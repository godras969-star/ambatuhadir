<html lang="id">
<head>

<html lang="id">
<head>

  <title>Ambatuhadir</title>
  <link rel="icon" href="logo.png">
  <style>
    :root {
      --navy: #0C193E; --biru: #1A76E5; --biru-tua: #164EC8; --cyan: #0EA4FC;
      --biru-muda: #ACDBFB; --latar: #E1EDF9; --putih: #FFFFFF; --ok: #0B8A4B; --err: #C62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--navy);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, var(--latar), var(--putih));
    }
    .wadah { max-width: 520px; margin: 0 auto; padding: 16px; }
    header { text-align: center; padding: 8px 0; }
    header img { width: 190px; max-width: 65%; height: auto; }
    h2 { font-size: 1.05rem; margin: 0 0 10px; }
    .kartu {
      background: var(--putih); border: 2px solid var(--biru-muda); border-radius: 20px;
      padding: 16px; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(26, 118, 229, .12);
    }
    label { display: block; font-size: .88rem; font-weight: 600; margin: 10px 0 4px; }
    input {
      width: 100%; font: inherit; padding: 11px 12px; color: var(--navy);
      border: 2px solid var(--biru-muda); border-radius: 12px; background: var(--putih);
    }
    input:focus, button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 1px; }
    button {
      font: inherit; font-weight: 600; color: var(--putih); cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--biru));
      border: 0; border-radius: 14px; padding: 11px 16px; margin: 12px 8px 0 0;
    }
    button.sekunder { background: var(--putih); color: var(--biru-tua); border: 2px solid var(--biru); }
    button.kecil { padding: 6px 12px; margin: 0; font-size: .85rem; }
    .pesan { min-height: 1.3em; margin: 10px 0 0; font-size: .9rem; }
    .pesan.err { color: var(--err); }
    .pesan.ok { color: var(--ok); }
    .qr { text-align: center; }
    .qr img { width: 100%; max-width: 280px; image-rendering: pixelated; border-radius: 12px; border: 6px solid var(--putih); box-shadow: 0 0 0 2px var(--biru-muda); }
    .nama { font-weight: 700; font-size: 1.1rem; margin: 0; }
    .sub { margin: 2px 0 12px; opacity: .75; font-size: .9rem; }
    .hasil { background: var(--latar); border-radius: 12px; padding: 10px 12px; margin-top: 12px; word-break: break-all; }
    .hasil code { font-size: 1.15rem; font-weight: 700; }
    .baris { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px dashed var(--biru-muda); }
    .baris small { display: block; opacity: .7; }
    label.cek { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 10px 0 0; cursor: pointer; }
    label.cek input { width: auto; margin: 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wadah">
    <header><img src="logo.png" alt="Logo Ambatuhadir"></header>

    <section class="kartu view" id="vLogin">
      <h2>Masuk</h2>
      <form id="fLogin">
        <label for="lUser">Username (NIM untuk mahasiswa)</label>
        <input id="lUser" autocomplete="username" autocapitalize="none" required>
        <label for="lPass">Password</label>
        <input id="lPass" type="password" autocomplete="current-password" required>
        <label class="cek"><input type="checkbox" data-lihat="lPass"> Tampilkan password</label>
        <button type="submit">Masuk</button>
      </form>
      <p class="pesan" id="pLogin"></p>
    </section>

    <section class="kartu view hidden" id="vGanti">
      <h2>Ganti password</h2>
      <p class="sub" id="infoGanti"></p>
      <form id="fGanti">
        <label for="gLama">Password lama</label>
        <input id="gLama" type="password" autocomplete="current-password" required>
        <label for="gBaru">Password baru (minimal 8 karakter)</label>
        <input id="gBaru" type="password" autocomplete="new-password" minlength="8" required>
        <label for="gUlang">Ulangi password baru</label>
        <input id="gUlang" type="password" autocomplete="new-password" minlength="8" required>
        <label class="cek"><input type="checkbox" data-lihat="gLama,gBaru,gUlang"> Tampilkan password</label>
        <button type="submit">Simpan password</button>
        <button type="button" class="sekunder" id="btnBatalGanti">Batal</button>
      </form>
      <p class="pesan" id="pGanti"></p>
    </section>

    <section class="kartu view hidden" id="vMhs">
      <div class="qr">
        <p class="nama" id="mNama"></p>
        <p class="sub" id="mNim"></p>
        <img id="mQR" alt="QR Code pribadi">
        <p class="sub">Tunjukkan QR ini ke Admin saat absensi.</p>
      </div>
      <button class="sekunder" id="btnGantiMhs">Ganti password</button>
      <button class="sekunder" id="btnKeluarMhs">Keluar</button>
    </section>

    <div class="view hidden" id="vAdmin">
      <section class="kartu">
        <h2>Tambah mahasiswa</h2>
        <form id="fTambah">
          <label for="tNim">NIM</label>
          <input id="tNim" autocomplete="off" required>
          <label for="tNama">Nama</label>
          <input id="tNama" autocomplete="off" required>
          <button type="submit">Tambah mahasiswa</button>
        </form>
        <p class="pesan" id="pTambah"></p>
        <div class="hasil hidden" id="hasil">
          <div id="hasilInfo"></div>
          <button type="button" class="kecil" id="btnSalin">Salin password</button>
        </div>
      </section>
      <section class="kartu">
        <h2>Daftar mahasiswa</h2>
        <div id="daftar"></div>
        <p class="pesan" id="pDaftar"></p>
      </section>
      <section class="kartu">
        <p class="sub" id="aNama"></p>
        <button class="sekunder" id="btnGantiAdm">Ganti password</button>
        <button class="sekunder" id="btnKeluarAdm">Keluar</button>
      </section>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    const el = (id) => document.getElementById(id);
    let token = '';
    let profil = null;
    try { token = sessionStorage.getItem('token') || ''; } catch (e) {}

    function tampil(id) {
      document.querySelectorAll('.view').forEach((v) => v.classList.add('hidden'));
      el(id).classList.remove('hidden');
      sembunyikanPassword();
    }

    // Kotak "Tampilkan password": ketuk untuk melihat isi kolom, dan otomatis kembali tersembunyi saat pindah halaman.
    function sembunyikanPassword() {
      ['lPass', 'gLama', 'gBaru', 'gUlang'].forEach((id) => { el(id).type = 'password'; });
      document.querySelectorAll('[data-lihat]').forEach((c) => { c.checked = false; });
    }
    document.querySelectorAll('[data-lihat]').forEach((c) => {
      c.addEventListener('change', () => {
        c.dataset.lihat.split(',').forEach((id) => { el(id).type = c.checked ? 'text' : 'password'; });
      });
    });

    function pesan(id, teks, tipe) {
      el(id).textContent = teks || '';
      el(id).className = 'pesan' + (tipe ? ' ' + tipe : '');
    }

    async function api(aksi, data) {
      try {
        const res = await fetch(CONFIG.URL_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(Object.assign({ aksi: aksi, token: token }, data || {}))
        });
        const j = await res.json();
        if (j.sesiHabis) { keluarLokal('Sesi habis, silakan login lagi.'); }
        return j;
      } catch (err) {
        return { ok: false, pesan: 'Tidak bisa terhubung ke server. Periksa koneksi internet.' };
      }
    }

    function keluarLokal(info) {
      token = '';
      profil = null;
      try { sessionStorage.removeItem('token'); } catch (e) {}
      el('fLogin').reset();
      pesan('pLogin', info || '', info ? 'err' : '');
      tampil('vLogin');
    }

    async function muat() {
      const j = await api('saya');
      if (!j.ok) { if (!j.sesiHabis) keluarLokal(j.pesan); return; }
      profil = j;
      if (j.wajibGanti) { bukaGanti(true); return; }
      if (j.peran === 'ADMIN') {
        el('aNama').textContent = 'Masuk sebagai ' + j.username + ' (Admin)';
        tampil('vAdmin');
        muatDaftar();
      } else {
        el('mNama').textContent = j.nama;
        el('mNim').textContent = 'NIM ' + j.username;
        if (typeof qrcode !== 'function') {
          el('mNim').textContent = 'Library QR gagal dimuat. Periksa koneksi internet.';
        } else {
          const qr = qrcode(0, 'M');
          qr.addData(j.kodeQR);
          qr.make();
          el('mQR').src = qr.createDataURL(8, 2);
        }
        tampil('vMhs');
      }
    }

    function bukaGanti(wajib) {
      el('fGanti').reset();
      pesan('pGanti', '');
      el('infoGanti').textContent = wajib
        ? 'Password default harus diganti dulu sebelum kamu bisa melanjutkan.' : '';
      el('btnBatalGanti').classList.toggle('hidden', !!wajib);
      tampil('vGanti');
    }

    async function muatDaftar() {
      const j = await api('daftar_mahasiswa');
      const box = el('daftar');
      box.textContent = '';
      if (!j.ok) { pesan('pDaftar', j.pesan, 'err'); return; }
      pesan('pDaftar', j.daftar.length ? '' : 'Belum ada mahasiswa. Tambahkan lewat formulir di atas.');
      j.daftar.forEach((m) => {
        const baris = document.createElement('div');
        baris.className = 'baris';
        const info = document.createElement('div');
        const nama = document.createElement('strong');
        nama.textContent = m.nama;
        const kecil = document.createElement('small');
        kecil.textContent = 'NIM ' + m.nim + (m.belumGanti ? ' - belum ganti password' : '');
        info.append(nama, kecil);
        const tombol = document.createElement('button');
        tombol.className = 'sekunder kecil';
        tombol.textContent = 'Reset password';
        tombol.addEventListener('click', () => resetPassword(m));
        baris.append(info, tombol);
        box.appendChild(baris);
      });
    }

    function tampilHasil(judul, username, pw) {
      el('hasilInfo').textContent = '';
      const t = document.createElement('div');
      t.textContent = judul + ' ' + username + '. Password default:';
      const c = document.createElement('code');
      c.textContent = pw;
      const p = document.createElement('div');
      p.className = 'sub';
      p.textContent = 'Catat sekarang. Password ini tidak akan ditampilkan lagi.';
      el('hasilInfo').append(t, c, p);
      el('hasil').classList.remove('hidden');
    }

    async function resetPassword(m) {
      if (!confirm('Reset password ' + m.nama + '? Password lamanya tidak berlaku lagi.')) return;
      const j = await api('reset_password', { nim: m.nim });
      if (!j.ok) { pesan('pDaftar', j.pesan, 'err'); return; }
      tampilHasil('Password direset untuk', j.username, j.passwordDefault);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      muatDaftar();
    }

    el('fLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      pesan('pLogin', 'Memeriksa...');
      const j = await api('login', { username: el('lUser').value, password: el('lPass').value });
      if (!j.ok) { pesan('pLogin', j.pesan, 'err'); return; }
      token = j.token;
      try { sessionStorage.setItem('token', token); } catch (err) {}
      el('fLogin').reset();
      pesan('pLogin', '');
      muat();
    });

    el('fGanti').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (el('gBaru').value !== el('gUlang').value) {
        pesan('pGanti', 'Password baru dan ulangannya tidak sama.', 'err');
        return;
      }
      pesan('pGanti', 'Menyimpan...');
      const j = await api('ganti_password', { lama: el('gLama').value, baru: el('gBaru').value });
      if (!j.ok) { pesan('pGanti', j.pesan, 'err'); return; }
      muat();
    });

    el('fTambah').addEventListener('submit', async (e) => {
      e.preventDefault();
      pesan('pTambah', 'Menyimpan...');
      el('hasil').classList.add('hidden');
      const j = await api('tambah_mahasiswa', { nim: el('tNim').value, nama: el('tNama').value });
      if (!j.ok) { pesan('pTambah', j.pesan, 'err'); return; }
      pesan('pTambah', '');
      tampilHasil('Mahasiswa ' + j.nama + ' ditambahkan. Username:', j.username, j.passwordDefault);
      el('fTambah').reset();
      muatDaftar();
    });

    el('btnSalin').addEventListener('click', () => {
      const pw = el('hasilInfo').querySelector('code').textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(pw);
      el('btnSalin').textContent = 'Tersalin';
      setTimeout(() => { el('btnSalin').textContent = 'Salin password'; }, 1500);
    });

    async function keluar() { await api('logout'); keluarLokal(''); }
    el('btnKeluarMhs').addEventListener('click', keluar);
    el('btnKeluarAdm').addEventListener('click', keluar);
    el('btnGantiMhs').addEventListener('click', () => bukaGanti(false));
    el('btnGantiAdm').addEventListener('click', () => bukaGanti(false));
    el('btnBatalGanti').addEventListener('click', muat);

    if (token) muat(); else tampil('vLogin');
  </script>
</body>
</html>

      box.textContent = '';
      if (!j.ok) { pesan('pDaftar', j.pesan, 'err'); return; }
      pesan('pDaftar', j.daftar.length ? '' : 'Belum ada mahasiswa. Tambahkan lewat formulir di atas.');
      j.daftar.forEach((m) => {
        const baris = document.createElement('div');
        baris.className = 'baris';
        const info = document.createElement('div');
        const nama = document.createElement('strong');
        nama.textContent = m.nama;
        const kecil = document.createElement('small');
        kecil.textContent = 'NIM ' + m.nim + (m.belumGanti ? ' - belum ganti password' : '');
        info.append(nama, kecil);
        const tombol = document.createElement('button');
        tombol.className = 'sekunder kecil';
        tombol.textContent = 'Reset password';
        tombol.addEventListener('click', () => resetPassword(m));
        baris.append(info, tombol);
        box.appendChild(baris);
      });
    }

    function tampilHasil(judul, username, pw) {
      el('hasilInfo').textContent = '';
      const t = document.createElement('div');
      t.textContent = judul + ' ' + username + '. Password default:';
      const c = document.createElement('code');
      c.textContent = pw;
      const p = document.createElement('div');
      p.className = 'sub';
      p.textContent = 'Catat sekarang. Password ini tidak akan ditampilkan lagi.';
      el('hasilInfo').append(t, c, p);
      el('hasil').classList.remove('hidden');
    }

    async function resetPassword(m) {
      if (!confirm('Reset password ' + m.nama + '? Password lamanya tidak berlaku lagi.')) return;
      const j = await api('reset_password', { nim: m.nim });
      if (!j.ok) { pesan('pDaftar', j.pesan, 'err'); return; }
      tampilHasil('Password direset untuk', j.username, j.passwordDefault);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      muatDaftar();
    }

    el('fLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      pesan('pLogin', 'Memeriksa...');
      const j = await api('login', { username: el('lUser').value, password: el('lPass').value });
      if (!j.ok) { pesan('pLogin', j.pesan, 'err'); return; }
      token = j.token;
      try { sessionStorage.setItem('token', token); } catch (err) {}
      el('fLogin').reset();
      pesan('pLogin', '');
      muat();
    });

    el('fGanti').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (el('gBaru').value !== el('gUlang').value) {
        pesan('pGanti', 'Password baru dan ulangannya tidak sama.', 'err');
        return;
      }
      pesan('pGanti', 'Menyimpan...');
      const j = await api('ganti_password', { lama: el('gLama').value, baru: el('gBaru').value });
      if (!j.ok) { pesan('pGanti', j.pesan, 'err'); return; }
      muat();
    });

    el('fTambah').addEventListener('submit', async (e) => {
      e.preventDefault();
      pesan('pTambah', 'Menyimpan...');
      el('hasil').classList.add('hidden');
      const j = await api('tambah_mahasiswa', { nim: el('tNim').value, nama: el('tNama').value });
      if (!j.ok) { pesan('pTambah', j.pesan, 'err'); return; }
      pesan('pTambah', '');
      tampilHasil('Mahasiswa ' + j.nama + ' ditambahkan. Username:', j.username, j.passwordDefault);
      el('fTambah').reset();
      muatDaftar();
    });

    el('btnSalin').addEventListener('click', () => {
      const pw = el('hasilInfo').querySelector('code').textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(pw);
      el('btnSalin').textContent = 'Tersalin';
      setTimeout(() => { el('btnSalin').textContent = 'Salin password'; }, 1500);
    });

    async function keluar() { await api('logout'); keluarLokal(''); }
    el('btnKeluarMhs').addEventListener('click', keluar);
    el('btnKeluarAdm').addEventListener('click', keluar);
    el('btnGantiMhs').addEventListener('click', () => bukaGanti(false));
    el('btnGantiAdm').addEventListener('click', () => bukaGanti(false));
    el('btnBatalGanti').addEventListener('click', muat);

    if (token) muat(); else tampil('vLogin');
  </script>
</body>
</html>
